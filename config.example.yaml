# Copy this file to google-ads.yaml and fill in your own values.
# NEVER commit google-ads.yaml to version control (add it to .gitignore).
#
# Where each value comes from:
#   developer_token    -> Google Ads UI > Tools & Settings > API Center
#   client_id/secret   -> Google Cloud Console > APIs & Services > Credentials
#   refresh_token      -> generated by running `python auth.py` (do not type by hand)
#   login_customer_id  -> your manager (MCC) account ID, digits only, no dashes
#                         (omit if you're not using a manager account)

developer_token: "YOUR_DEVELOPER_TOKEN"
client_id: "YOUR_OAUTH_CLIENT_ID.apps.googleusercontent.com"
client_secret: "YOUR_OAUTH_CLIENT_SECRET"
refresh_token: ""   # left blank until auth.py fills it in
login_customer_id: "YOUR_MANAGER_ACCOUNT_ID"
use_proto_plus: true
